    <script>
      function onApplePayButtonClicked() {
        if (!ApplePaySession) {
          return;
        }
        const applePayPaymentRequest = {
          countryCode: "SA",
          currencyCode: "SAR",
          supportedNetworks: ["mada", "visa", "masterCard"],
          merchantCapabilities: [
            "supports3DS",
            "supportsDebit",
            "supportsCredit",
          ],
          total: {
            label: "Abdullah Store",
            amount: "1",
          },
        };

        // Create Apple Pay Session
        const session = new ApplePaySession(5, applePayPaymentRequest);

        // Provide Merchant Validation
        session.onvalidatemerchant = async (event) => {
          const body = {
            validation_url: event.validationURL,
            display_name: "https://jobzai.net/",
            domain_name: window.location.hostname,
            publishable_api_key:
              "pk_test_UePDryuCKsGTU6ckJ693j5wN5ovtw9EJWkjurNz4",
          };

          try {
            const response = await fetch(
              "https://api.moyasar.com/v1/applepay/initiate",
              {
                method: "post",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
              }
            );

            session.completeMerchantValidation(await response.json());
          } catch (error) {
            session.completeMerchantValidation(error);
          }
        };

        // Payment Authorization
        session.onpaymentauthorized = async (event) => {
          const token = event.payment.token;
          console.log("Apple Pay Token:", token);
          // prepare request for moyasar
          let body = {
            amount: applePayPaymentRequest.total.amount * 100,
            currency: applePayPaymentRequest.currencyCode,
            description: "My Awsome Order #1234",
            publishable_api_key:
              "pk_test_UePDryuCKsGTU6ckJ693j5wN5ovtw9EJWkjurNz4",
            source: {
              type: "applepay",
              token: token,
            },
            metadata: {
              userId: "54",
              planId: "1",
            },
          };

          // send the request
          const response = await fetch("https://api.moyasar.com/v1/payments", {
            method: "post",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });

          const responseJson = await response.json();

          if (!response.ok) {
            session.completePayment({
              status: ApplePaySession.STATUS_FAILURE,
              errors: [responseJson.message],
            });

            return;
          }

          if (responseJson.status != "paid") {
            session.completePayment({
              status: ApplePaySession.STATUS_FAILURE,
              errors: [responseJson.source.message],
            });

            return;
          }

          // TODO: Report payment result to merchant backend
          const backend = await fetch(
            "http://209.159.154.60:9000/api/v1/payments/log-apple-pay",
            {
              method: "post",
              headers: { "Content-Type": "application/json" },
              body: responseJson,
            }
          );
          const backendResponse = await backend.json();
          console.log("Backend Response:", backendResponse);

          // TODO: Add any merchant related bussiness logic here

          session.completePayment({
            status: ApplePaySession.STATUS_SUCCESS,
          });
        };

        session.begin();
      }
    </script>
