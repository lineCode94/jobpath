  <style>
    * {
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }
    body {
      background: #f8fafc;
     
      height: 100vh;
    }
    .payment-container {
      background: #fff;
      margin: 150px auto;
      width: 100%;
      max-width: 480px;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h2 {
      margin-bottom: 1rem;
      font-size: 1.5rem;
      color: #111;
    }
    .plan-box {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      border: 1px solid #e2e8f0;
    }
    .plan-name {
      font-size: 1.2rem;
      font-weight: 600;
    }
    .plan-price {
      color: #2563eb;
      font-weight: 600;
      margin-top: 4px;
    }
    .payment-methods {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .method {
      flex: 1 1 45%;
      padding: 1rem;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
      cursor: pointer;
      transition: 0.3s;
      background: #fff;
    }
    .method:hover {
      border-color: #2563eb;
      transform: translateY(-2px);
    }
    .method.active {
      border-color: #2563eb;
      background: #eff6ff;
    }
    .method img {
      width: 60px;
      margin-bottom: 8px;
    }
    #proceedBtn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    #proceedBtn img {
      width: 22px;
      height: 22px;
    }
    #proceedBtn.apple {
      background: #000;
    }
    #proceedBtn.moyasser {
      background: #2563eb;
    }
    #proceedBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
