 <style>
    body {
  background: var(--bg-page);
  font-family: "Plus Jakarta Sans", "Tajawal", sans-serif;
  color: var(--text-main);
}

/* Main Card */
.card-main {
  background: var(--bg-card);
  border-radius: 20px;
  border: 1px solid var(--border-light);
  box-shadow: 0 20px 40px rgba(0,0,0,0.05);
  padding: 28px;
  max-width: 1100px;
  margin: 140px auto 40px;
}

/* Status badge */
.badge-status {
  font-size: 0.8rem;
  padding: 6px 14px;
  border-radius: 999px;
  font-weight: 600;
  background: var(--primary-soft);
  color: var(--primary);
}

/* Score Circle */
.score-circle {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  border: 6px solid var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: #fff;
  background: #34a853;
}

.score-circle .score-value {
  font-size: 25px;
  font-weight: 700;
}

.score-circle .score-label {
  font-size: 16px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
}

/* Sections */
.section-title {
  font-size:16px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 10px;
}

/* Sub cards */
.card-sub {
  background: #fff;
  border-radius: 14px;
  border: 1px solid var(--border-light);
  padding: 14px 16px;
  margin-bottom: 14px;
}

/* Progress */
.progress {
  height: 6px;
  background-color: #34a853;
  border-radius: 999px;
}

.progress-bar {
  background: var(--primary);
  border-radius: 999px;
}

/* Pills */
.pill {
  display: inline-flex;
  align-items: center;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid var(--border-light);
  font-size: 0.75rem;
  background: #fff;
  color: var(--text-muted);
}

.pill-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  margin-right: 6px;
  background: var(--primary);
}

/* Skills */
.skills-list li {
  font-size: 0.85rem;
  margin-bottom: 6px;
  color: var(--text-main);
}

/* Summary */
#lblSummary {
  font-size: 0.9rem;
  line-height: 1.6;
}

#lblKeywordsSummary {
  font-size: 0.8rem;
  color: var(--text-muted);
}
