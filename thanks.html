    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

   

        .success-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-icon {
            color: #34a853;
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 1s ease infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .order-details {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin: 25px 0;
            text-align: left;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e9ecef;
        }

        .detail-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .receipt {
            background: #fff;
            border: 2px dashed #dee2e6;
            padding: 20px;
            margin-top: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .receipt-code {
            font-family: monospace;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        @media (max-width: 480px) {
            .success-container {
                padding: 30px 20px;
            }
            
            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        
        <h1>Payment Successful!</h1>
        <p>Thank you for your purchase. Your payment has been processed successfully.</p>
        
        <div class="order-details" id="orderDetails">
            <!-- Order details will be populated by JavaScript -->
        </div>

        <div class="receipt">
            <p><strong>Payment Receipt</strong></p>
            <div class="receipt-code" id="receiptCode">
                Loading receipt...
            </div>
        </div>
        
        <div class="buttons">
            <button onclick="window.location.href='index.html'" class="btn btn-primary">
                <i class="fas fa-home"></i> Back to Home
            </button>
            <button class="btn btn-secondary" onclick="printReceipt()">
                <i class="fas fa-print"></i> Print Receipt
            </button>
        </div>
    </div>
    <div style="width: 100%" data-include="layout/footer.html"></div>

    <script>
        // Get order ID and method from URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order') || 'ORD-' + Date.now();
        const paymentMethod = urlParams.get('method') || 'Credit Card';
        
        // Generate a fake payment ID for demo
        const paymentId = 'PAY-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        const transactionId = 'TXN-' + Math.random().toString(36).substr(2, 12).toUpperCase();
        
        // Populate order details
        const orderDetails = document.getElementById('orderDetails');
        orderDetails.innerHTML = `
            <div class="detail-item">
                <span>Order ID:</span>
                <strong>${orderId}</strong>
            </div>
            <div class="detail-item">
                <span>Date:</span>
                <span>${new Date().toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                })}</span>
            </div>
            <div class="detail-item">
                <span>Amount:</span>
                <strong>SAR 115.00</strong>
            </div>
            <div class="detail-item">
                <span>Payment Method:</span>
                <span>${paymentMethod}</span>
            </div>
            <div class="detail-item">
                <span>Payment ID:</span>
                <span>${paymentId}</span>
            </div>
            <div class="detail-item">
                <span>Status:</span>
                <span style="color: #34a853; font-weight: 600;">Completed</span>
            </div>
        `;
        
        // Generate receipt code
        const receiptCode = document.getElementById('receiptCode');
        receiptCode.innerHTML = `
            Transaction: ${transactionId}<br>
            Auth Code: ${Math.random().toString().substr(2, 6)}<br>
            Time: ${new Date().toLocaleTimeString()}
        `;
        
        // Print receipt 
        function printReceipt() {
            const printContent = `
                <html>
                <head>
                    <title>Payment Receipt</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 20px; }
                        .header { text-align: center; margin-bottom: 30px; }
                        .details { margin: 20px 0; }
                        .detail-row { display: flex; justify-content: space-between; margin: 10px 0; }
                        .footer { margin-top: 30px; text-align: center; color: #666; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h2>Payment Receipt</h2>
                        <p>${new Date().toLocaleDateString()}</p>
                    </div>
                    <div class="details">
                        <div class="detail-row"><strong>Order ID:</strong> ${orderId}</div>
                        <div class="detail-row"><strong>Payment ID:</strong> ${paymentId}</div>
                        <div class="detail-row"><strong>Transaction ID:</strong> ${transactionId}</div>
                        <div class="detail-row"><strong>Amount:</strong> SAR 115.00</div>
                        <div class="detail-row"><strong>Payment Method:</strong> ${paymentMethod}</div>
                        <div class="detail-row"><strong>Date:</strong> ${new Date().toLocaleString()}</div>
                        <div class="detail-row"><strong>Status:</strong> <span style="color: #34a853;">Completed</span></div>
                    </div>
                    <div class="footer">
                        <p>Thank you for your purchase!</p>
                        <p>This is a computer-generated receipt.</p>
                    </div>
                </body>
                </html>
            `;
            
            const printWindow = window.open('', '_blank');
            printWindow.document.write(printContent);
            printWindow.document.close();
            printWindow.focus();
            setTimeout(() => {
                printWindow.print();
                printWindow.close();
            }, 250);
        }
        
        // Store successful payment in database or logs if needed 
        localStorage.setItem('last_payment', JSON.stringify({
            orderId: orderId,
            paymentId: paymentId,
            transactionId: transactionId,
            amount: 115.00,
            currency: 'SAR',
            method: paymentMethod,
            date: new Date().toISOString(),
            status: 'completed'
        }));
    </script>
