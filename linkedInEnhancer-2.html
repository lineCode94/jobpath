  <title> LinkedIn Profile Enhancer</title>
  <style>
    :root{
      --bg:#f6fbf7;
      --bg-soft:#eef8f0;
      --card:#ffffff;
      --line:#d8eadb;
      --text:#163126;
      --muted:#5f7c6d;
      --primary:#34a853;
      --primary-soft:#e5f7ed;
      --accent:#76c893;
      --chip:#edf8f1;
      --shadow:0 16px 40px rgba(24, 78, 48, 0.10);
      --radius:24px;
      --radius-sm:16px;
      --max:1320px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--text);
      font-family:Inter, "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(118,200,147,.16), transparent 28%),
        linear-gradient(180deg, #f8fcf8 0%, #eef8f0 100%);
      min-height:100vh;
    }
    body[dir="rtl"]{font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif}

    .container{width:min(calc(100% - 28px), var(--max)); margin:0 auto;}
   
    .brand{display:flex; align-items:center; gap:14px}
    .brand-mark{
      width:50px;height:50px;border-radius:18px;display:grid;place-items:center;
      background:linear-gradient(135deg, var(--primary), var(--accent));
      color:#fff;font-weight:900;box-shadow:var(--shadow)
    }
    .brand h1{margin:0 0 4px;font-size:20px;font-weight:800}
    .brand p{margin:0;color:var(--muted);font-size:13px}

    .toolbar{display:flex;gap:10px;flex-wrap:wrap}
    .toolbar select,.toolbar button{
      height:44px;border-radius:14px;border:1px solid var(--line);
      background:#fff;color:var(--text);padding:0 16px;cursor:pointer;
      font-weight:700;
    }
    .toolbar .primary{
      background:linear-gradient(135deg, var(--primary), #4fb477);
      color:#fff;border:none;
    }

    .hero{padding:34px 0 18px}
    .hero-card{
      background:linear-gradient(180deg, #ffffff, #f9fdf9);
      border:1px solid var(--line); border-radius:30px; box-shadow:var(--shadow);
      padding:30px; overflow:hidden; position:relative;
    }
     
    .eyebrow{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:var(--primary-soft); color:var(--primary); border:1px solid #cfe8d7;
      font-size:12px; font-weight:800; margin-bottom:16px;
    }
    .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start}
    .hero h2{margin:0 0 12px;font-size:34px;line-height:1.15;max-width:780px}
    .hero .lead{margin:0 0 22px;color:var(--muted);line-height:1.9;font-size:15px;max-width:830px}
    .headline-box{
      border-radius:22px; padding:18px; background:var(--primary-soft); border:1px solid #d5efde;
    }
    .headline-label{color:var(--primary);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
    .headline-value{font-size:25px;font-weight:800;line-height:1.5}

    .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .quick-card{
      background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;min-height:104px;
    }
    .quick-card .label{font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:800}
    .quick-card .value{font-size:14px;line-height:1.8;font-weight:700}

    .layout{padding:20px 0 48px;display:grid;grid-template-columns:280px 1fr;gap:20px}
    .sidebar{
      position:sticky;top:92px;align-self:start;background:#fff;border:1px solid var(--line);
      border-radius:24px;padding:20px;box-shadow:var(--shadow);
    }
    .sidebar h3{margin:0 0 14px;font-size:16px}
    .nav{display:flex;flex-direction:column;gap:8px}
    .nav a{
      text-decoration:none;color:var(--text);padding:12px 14px;border-radius:14px;
      background:#f8fcf8;border:1px solid transparent;font-size:14px;transition:.18s ease;
    }
    .nav a:hover,.nav a.active{background:var(--primary-soft);border-color:#cde7d6;transform:translateY(-1px)}
    .copy-panel{
      margin-top:18px;padding:16px;border-radius:18px;background:var(--bg-soft);
      border:1px solid var(--line);
    }
    .copy-panel p{margin:0 0 14px;color:var(--muted);line-height:1.8;font-size:13px}
    .copy-panel button{
      width:100%;height:42px;border:none;border-radius:12px;
      background:var(--primary);
      color:#fff;font-weight:800;cursor:pointer;
    }

    .main{display:grid;gap:18px}
    .section{
      scroll-margin-top:94px;background:#fff;border:1px solid var(--line);
      border-radius:26px;box-shadow:var(--shadow);padding:24px;
    }
    .section-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
    .section-title{margin:0;font-size:23px;font-weight:800}
    .section-subtitle{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.8}
    .section-actions{display:flex;gap:10px;flex-wrap:wrap}
    .ghost-btn{
      height:40px;border:none;border-radius:12px;padding:0 14px;background:#f8fcf8;
      border:1px solid var(--line);color:var(--text);cursor:pointer;font-weight:800;
    }

    .content-grid-2{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:16px}
    .card{border-radius:20px;padding:18px;background:#fbfefb;border:1px solid var(--line);min-height:100px}
    .card h4{margin:0 0 10px;font-size:15px}
    .text{color:var(--text);line-height:1.9;font-size:15px;white-space:pre-line}

    .chip-wrap{display:flex;flex-wrap:wrap;gap:10px}
    .chip{
      display:inline-flex;align-items:center;padding:10px 12px;border-radius:999px;
      background:var(--chip);color:var(--text);border:1px solid var(--line);font-size:13px;font-weight:800;
    }

    .item-list{display:grid;gap:14px}
    .item{border-radius:20px;padding:18px;background:#fbfefb;border:1px solid var(--line)}
    .item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
    .item-title{margin:0;font-size:17px;font-weight:800}
    .item-sub{color:var(--muted);font-size:13px;font-weight:800;margin-top:4px}
    .meta-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
    .meta-pill{padding:10px 12px;border-radius:14px;background:var(--bg-soft);border:1px solid var(--line);font-size:13px;color:var(--muted)}
    .footer-note{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.8}

    @media (max-width:1180px){
      .layout{grid-template-columns:1fr}
      .sidebar{position:relative;top:0}
    }
    @media (max-width:980px){
      .hero-grid,.content-grid-2,.quick-grid,.meta-row{grid-template-columns:1fr}
      .hero h2{font-size:29px}
      .headline-value{font-size:22px}
    }
    @media (max-width:640px){
      .container{width:min(calc(100% - 18px), var(--max))}
      .hero-card,.section,.sidebar{padding:18px}
      .toolbar{width:100%}
      .toolbar select,.toolbar button,.section-actions .ghost-btn{width:100%}
    }
  </style>
